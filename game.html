<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Društvene Igre - Igra</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="javascript/jquery-3.6.4.min.js"></script>
    <script src="javascript/games.js"></script>
    <script src="javascript/translation.js"></script>
    <script src="javascript/script.js"></script>
</head>
<body id="background">

    <header class="site-headers" id="header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-6 col-md-6">
                    <button id="title" onclick="index()"><h2 id="web-name"><span data-translate="website">DRUŠTVENE IGRE</span><img class="header-images" src="images/2-Dice-Icon.svg"></h2></button>
                </div>
                <div id="right-col" class="col-6 col-md-6">
                    <a href="account.html"><img class="header-images" src="images/shopping-cart-white-icon.webp"></a>
                    <button class="language" translate="no" onclick="changeLanguage('srb')">SRB</button>
                    <button class="language" translate="no" onclick="changeLanguage('eng')">ENG</button>
                </div>
            </div>
        </div>
    </header>

    <nav>
        <ul id="navigation">
            <li class="section"><button id="nav1" class="select-page" onclick="index()"><h6 data-translate="home">Početna</h6></button></li>
            <li class="section dropdown">
                <button id="nav2" class="select-page dropbtn"><h6 data-translate="gallery">Galerija</h6></button>
                <div class="dropdown-content">
                    <a href="gallery.html?section=store" data-translate="store">Prodavnica</a>
                    <a href="gallery.html?section=games" data-translate="games">Igre</a>
                    <a href="gallery.html?section=tournaments" data-translate="tournaments">Turnire</a>
                </div>
            </li>
            <li class="section dropdown">
                <button id="nav3" class="select-page dropbtn"><h6 data-translate="catalog">Katalog Igara</h6></button>
                <div class="dropdown-content">
                    <a href="catalog.html?section=family" data-translate="family">Porodične</a>
                    <a href="catalog.html?section=strategy" data-translate="strategy">Strateške</a>
                    <a href="catalog.html?section=party" data-translate="party">Zabavne</a>
                </div>
            </li>
            <li class="section"><button id="nav4" class="select-page" onclick="account()"><h6 data-translate="account">Moj Nalog</h6></button></li>
            <li class="section"><button id="nav5" class="select-page" onclick="about()"><h6 data-translate="about">O Nama</h6></button></li>
        </ul>
    </nav>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html" data-translate="home">Početna</a></li>
            <li class="breadcrumb-item"><a href="catalog.html" data-translate="catalog">Katalog Igara</a></li>
            <li class="breadcrumb-item"><a id="breadcrumb-category"></a></li>
            <li class="breadcrumb-item active" id="breadcrumb-game" aria-current="page"></li>
        </ol>
    </nav>
    <hr class="break">

    <br>
    <br>
    <main>
        <div class="container-fluid">
            <div id="game-info" class="ms-5 me-5"></div>

            <div id="ratings" class="ms-5 me-5"></div>
        </div>
        <br>
        <br>
    </main>
    <br>

    <footer class="site-headers" id="footer">
        <h6 data-translate="footer">Copyright 2026, Mile Maćešić, Odsek za Softversko Inženjerstvo Elektrotehničkog fakulteta Univerziteta u Beogradu</h6>
    </footer>

</html>
